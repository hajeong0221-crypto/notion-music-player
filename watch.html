<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>worldtime.exe</title><style>
*{box-sizing:border-box}body{margin:0;padding:14px;font-family:Verdana,'Trebuchet MS',sans-serif;background:transparent;color:var(--ink)}body[data-theme=aqua]{--base:#c8f3ff;--panel:#ecfdff;--ink:#245574;--edge:#6bbbd9;--accent:#00bde1;--head:#78d7f3;--shadow:#80c9eb}body[data-theme=lime]{--base:#c5d7aa;--panel:#e4f3c5;--ink:#24452d;--edge:#526f5a;--accent:#f35b9b;--head:#91b652;--shadow:#63815c}body[data-theme=win]{--base:#c6c6c6;--panel:#f1f1ef;--ink:#202020;--edge:#666;--accent:#153ca5;--head:#123a9c;--shadow:#777}body[data-theme=pastel]{--base:#ffe3ee;--panel:#fff7fb;--ink:#a4547c;--edge:#efa4c4;--accent:#e97db3;--head:#f6b4d5;--shadow:#e8a7c6}body[data-theme=midnight]{--base:#161029;--panel:#251a42;--ink:#e8d7ff;--edge:#7960b2;--accent:#b68dff;--head:#4c3481;--shadow:#2a1b50}body[data-theme=pixel]{--base:#ffe4f1;--panel:#fff9fd;--ink:#8d1d53;--edge:#a92e69;--accent:#ec5b9e;--head:#f7b5d5;--shadow:#e87aa8}
.shell{max-width:940px;margin:auto;background:var(--base);border:2px solid var(--edge);border-radius:22px;padding:12px;box-shadow:inset 0 2px 4px #fff9,0 9px 25px color-mix(in srgb,var(--shadow),transparent 58%);position:relative}.top{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,var(--panel),var(--head));padding:9px 14px;border-radius:12px;border:1px solid var(--edge);font-weight:800;letter-spacing:1px}.top small{font-size:10px;letter-spacing:2px;opacity:.75}.settingsBtn,.close,button,select,input{font:inherit}button{cursor:pointer}.settingsBtn{border:1px solid var(--edge);background:var(--panel);color:var(--ink);border-radius:9px;padding:5px 11px}.cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.city{position:relative;min-width:0;text-align:center;background:linear-gradient(150deg,#ffffff8c,transparent 75%),var(--panel);border:1px solid var(--edge);border-radius:15px;padding:12px 6px 15px;box-shadow:inset 0 2px 3px #fff9,0 3px 0 color-mix(in srgb,var(--edge),transparent 45%)}.icon{font-size:32px;line-height:1.3}.name{font-size:11px;letter-spacing:1.2px;font-weight:900;margin-top:5px}.time{font-size:clamp(20px,4.2vw,37px);font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:8px 0 2px;white-space:nowrap}.date{font-size:10px;opacity:.8}.weather{font-size:12px;margin-top:12px;background:color-mix(in srgb,var(--base),transparent 25%);border-radius:20px;display:inline-block;padding:6px 10px;min-height:29px}.foot{display:flex;justify-content:space-between;padding:11px 5px 0;font-size:10px;opacity:.75}.live{color:var(--accent)}.live:before{content:'● ';font-size:9px}body[data-theme=win] .shell,body[data-theme=win] .city,body[data-theme=win] .top,body[data-theme=win] .settingsBtn{border-radius:1px;box-shadow:inset 2px 2px #fff,inset -2px -2px #666}body[data-theme=win] .top{background:var(--head);color:#fff}body[data-theme=win] .settingsBtn{color:#222}body[data-theme=pixel] .shell,body[data-theme=pixel] .city,body[data-theme=pixel] .top{border-radius:0;border-width:3px;box-shadow:4px 4px 0 #e9a4c5}body[data-theme=pixel] .top:before{content:'♥ ♥ ♥';margin-right:7px;color:#e65a9c}body[data-theme=midnight] .city{box-shadow:inset 0 0 18px #a87aff25}body[data-theme=lime] .time{font-family:monospace;color:#31631e}body[data-theme=aqua] .shell{background:linear-gradient(125deg,#f2ffff,#8ed6f6 55%,#d5fcff)}
.modalBackdrop{position:fixed;inset:0;background:#10152588;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}.modalBackdrop.open{display:flex}.modal{background:#f8f8ff;color:#30394b;border-radius:16px;width:min(470px,100%);max-height:92vh;overflow:auto;padding:18px;box-shadow:0 12px 45px #0005}.modal h2{font-size:17px;margin:0 0 12px}.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.theme{padding:11px 5px;border:2px solid #d4d6df;border-radius:10px;background:#fff;color:#30394b;font-size:12px}.theme.selected{border-color:#438ed8;background:#eaf5ff}.theme[data-choice=aqua]{background:#d9f8ff}.theme[data-choice=lime]{background:#d7e8c0}.theme[data-choice=win]{background:#ddd}.theme[data-choice=pastel]{background:#ffe5f0}.theme[data-choice=midnight]{background:#241b3d;color:#fff}.theme[data-choice=pixel]{background:#ffd9ed}.field{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px;font-size:13px}.field select{max-width:65%;padding:6px;border:1px solid #c6cad7;border-radius:7px;background:white}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;padding:10px;border:0;border-radius:9px;background:#dce4f1}.actions button:last-child{background:#367fd1;color:white}.hint{font-size:11px;line-height:1.6;color:#697487;margin:10px 0 0}@media(max-width:390px){body{padding:5px}.shell{padding:7px}.cities{gap:5px}.city{padding:10px 2px}.icon{font-size:24px}.name{font-size:9px;letter-spacing:0}.time{font-size:19px}.weather{font-size:10px;padding:5px 3px}}
</style></head><body data-theme="aqua"><main class="shell"><div class="top"><span>✧ worldtime.exe <small> / 001</small></span><button class="settingsBtn" id="openSettings" aria-label="설정 열기">⚙ SETTINGS</button></div><div class="cities" id="cities"></div><div class="foot"><span>SEOUL · LONDON · BARCELONA</span><span class="live">LIVE WORLD TIME</span></div></main><div class="modalBackdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="세계 시계 설정"><h2>⚙ worldtime.exe / settings</h2><div class="themes" id="themes"></div><label class="field">시간 표시 <select id="hour"><option value="24">24시간제</option><option value="12">12시간제</option></select></label><label class="field">초 표시 <input type="checkbox" id="seconds"></label><label class="field">날씨 표시 <input type="checkbox" id="showWeather" checked></label><label class="field">도시 상징 아이콘 <select id="iconStyle"><option value="landmark">랜드마크</option><option value="symbol">심플 아이콘</option></select></label><div class="actions"><button id="cancel">취소</button><button id="save">저장</button></div><p class="hint">설정은 현재 브라우저에 저장됩니다. 노션 임베드에서는 기기별로 다를 수 있어요. 날씨는 인터넷 연결 시 갱신됩니다.</p></section></div><script>
const locations=[{name:'SEOUL',tz:'Asia/Seoul',lat:37.5665,lon:126.9780,icons:['🏙️','🌸']},{name:'LONDON',tz:'Europe/London',lat:51.5072,lon:-0.1276,icons:['🕰️','☕']},{name:'BARCELONA',tz:'Europe/Madrid',lat:41.3874,lon:2.1686,icons:['⛪','☀️']}];const themeNames={aqua:'🫧 Aqua 2004',lime:'💚 Cyber Lime',win:'🖥 Windows 98',pastel:'🌸 Pastel Dream',midnight:'🌌 Midnight.exe',pixel:'💗 Pixel Romance'};const defaults={theme:'aqua',hour:'24',seconds:false,showWeather:true,iconStyle:'landmark'};let config={...defaults};try{config={...defaults,...JSON.parse(localStorage.getItem('worldtime-config')||'{}')}}catch{}let draft={...config};let weather={};const $=id=>document.getElementById(id);function render(){document.body.dataset.theme=config.theme;$('cities').innerHTML=locations.map((c,i)=>`<article class="city"><div class="icon">${c.icons[config.iconStyle==='symbol'?1:0]}</div><div class="name">${c.name}</div><div class="time" id="time${i}">--:--</div><div class="date" id="date${i}">---</div><div class="weather" id="weather${i}" style="display:${config.showWeather?'inline-block':'none'}">${weather[i]||'날씨 확인 중...'}</div></article>`).join('');tick()}function tick(){locations.forEach((c,i)=>{let time=new Intl.DateTimeFormat('en-GB',{timeZone:c.tz,hour:'2-digit',minute:'2-digit',...(config.seconds?{second:'2-digit'}:{}),hour12:config.hour==='12'}).format(new Date());let day=new Intl.DateTimeFormat('en-US',{timeZone:c.tz,month:'short',day:'numeric',weekday:'short'}).format(new Date());let t=$('time'+i),d=$('date'+i);if(t)t.textContent=time;if(d)d.textContent=day})}const weatherIcon=code=>code===0?'☀️':code<=3?'⛅':code<=48?'🌫️':code<=67?'🌧️':code<=77?'❄️':code<=82?'🌦️':code<=86?'🌨️':'⛈️';async function loadWeather(){await Promise.all(locations.map(async(c,i)=>{try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&timezone=auto`;let r=await fetch(url);if(!r.ok)throw Error('weather');let d=await r.json();weather[i]=`${weatherIcon(d.current.weather_code)} ${Math.round(d.current.temperature_2m)}°C`}catch{weather[i]='날씨 연결 안 됨'}let el=$('weather'+i);if(el)el.textContent=weather[i]}))}function openModal(){draft={...config};$('themes').innerHTML=Object.entries(themeNames).map(([key,label])=>`<button class="theme ${key===draft.theme?'selected':''}" data-choice="${key}">${label}</button>`).join('');$('themes').querySelectorAll('button').forEach(b=>b.onclick=()=>{draft.theme=b.dataset.choice;$('themes').querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))});$('hour').value=draft.hour;$('seconds').checked=draft.seconds;$('showWeather').checked=draft.showWeather;$('iconStyle').value=draft.iconStyle;$('backdrop').classList.add('open')}$('openSettings').onclick=openModal;$('cancel').onclick=()=>$('backdrop').classList.remove('open');$('backdrop').onclick=e=>{if(e.target===$('backdrop'))$('backdrop').classList.remove('open')};$('save').onclick=()=>{config={...draft,hour:$('hour').value,seconds:$('seconds').checked,showWeather:$('showWeather').checked,iconStyle:$('iconStyle').value};try{localStorage.setItem('worldtime-config',JSON.stringify(config))}catch{}$('backdrop').classList.remove('open');render()};render();loadWeather();setInterval(tick,1000);setInterval(loadWeather,15*60*1000);
</script></body></html>
