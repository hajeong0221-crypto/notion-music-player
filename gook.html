<!DOCTYPE html>  
<html>  
<head>  
<style>  
    @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');  
  
    @font-face {  
        font-family: 'Galmuri11-Bold';  
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri11-Bold.woff2') format('woff2');  
        font-weight: 700;  
    }  
  
    body {  
        background-image: radial-gradient(#ff4d4d 20%, transparent 20%), radial-gradient(#ff4d4d 20%, transparent 20%);  
        background-color: #e60000;  
        background-position: 0 0, 25px 25px;  
        background-size: 50px 50px;  
        font-family: 'Galmuri', sans-serif;  
        display: flex;  
        justify-content: center;  
        align-items: center;  
        min-height: 100vh;  
        margin: 0;  
        padding: 20px;  
        image-rendering: pixelated;  
    }  
  
    .quest-card {  
        background: #fff9f0;  
        border: 5px solid #3e2723;  
        padding: 25px;  
        width: 100%;  
        max-width: 460px;  
        box-shadow: 12px 12px 0px rgba(0,0,0,0.3);  
    }  
  
    .header {  
        font-family: 'Galmuri11-Bold', sans-serif;  
        background: #ffc107;  
        border: 4px solid #3e2723;  
        margin: -45px auto 20px;  
        padding: 10px;  
        text-align: center;  
        width: 80%;  
        font-size: 20px;  
        color: #3e2723;  
    }  
  
    .mama-speech {  
        background: white;  
        border: 3px solid #3e2723;  
        padding: 12px;  
        font-size: 13px;  
        margin-bottom: 20px;  
        line-height: 1.6;  
        font-weight: 400;  
    }  
  
    .session-item {  
        border-bottom: 3px double #d7ccc8;  
        padding: 12px 0;  
        display: flex;  
        justify-content: space-between;  
        align-items: center;  
    }  
  
    .session-info {   
        font-size: 12px;   
        color: #666;   
        flex-grow: 1;   
        font-weight: 400;  
    }  
      
    .session-title {   
        font-family: 'Galmuri11-Bold', sans-serif;  
        font-weight: 700;  
        color: #d32f2f;   
        margin-top: 6px;   
        font-size: 14px;  
    }  
  
    /* 상태 버튼 스타일 - 클릭 가능하게 cursor 추가 */  
    .status {  
        background: #fb8c00;  
        color: white;  
        padding: 6px 12px;  
        border: 2px solid #3e2723;  
        font-size: 11px;  
        margin-left: 10px;  
        white-space: nowrap;  
        font-family: 'Galmuri11-Bold', sans-serif;  
        cursor: pointer;  
        transition: 0.2s;  
        user-select: none;  
    }  
  
    .status:hover { transform: scale(1.05); }  
  
    /* 완료 상태 스타일 */  
    .status.completed {  
        background: #7d7d7d !important;  
        color: #ccc !important;  
        animation: none !important;  
    }  
  
    .status.boss { background: #f44336; animation: blink 1s infinite; }  
    .status.final { background: #2196f3; }  
  
    @keyframes blink { 50% { opacity: 0.7; } }  
</style>  
</head>  
<body>  
  
<div class="quest-card">  
    <div class="header">👨‍🍳 불타는 요리 퀘스트!</div>  
      
    <div class="mama-speech">  
        💬 마마: "세션을 들었으면 버튼을 눌러서<br>요리를 완성시켜줘! 화이팅!" ❤️  
    </div>  
  
    <div class="session-item">  
        <div class="session-info">  
            📅 4/21 17:00 |   
            <div class="session-title">과제해설 </div>  
        </div>  
        <div class="status" onclick="toggleStatus(this)">준비중</div>  
    </div>  
  
    <div class="session-item">  
        <div class="session-info">  
            📅 4/22 10:00 | 최종프로젝트 발제  
            <div class="session-title">최종프로젝트 발제</div>  
        </div>  
        <div class="status" onclick="toggleStatus(this)">대기</div>  
    </div>  
  
    <div class="session-item">  
        <div class="session-info">  
            📅 4/22 15:00 | 세션  
            <div class="session-title">랜딩페이지세션</div>  
        </div>  
        <div class="status" onclick="toggleStatus(this)">대기</div>  
    </div>  
  
    <div class="session-item">  
        <div class="session-info">  
            📅 4/23 11:00 | 세션  
            <div class="session-title">🧂 틱톡 광고계정 운영 세션</div>  
        </div>  
        <div class="status" onclick="toggleStatus(this)">대기</div>  
    </div>  
  
      
<script>  
    // 클릭하면 상태를 토글하는 함수  
    function toggleStatus(element) {  
        if (!element.classList.contains('completed')) {  
            element.dataset.originalText = element.innerText; // 원래 글자 저장  
            element.innerText = "완료 ✅";  
            element.classList.add('completed');  
        } else {  
            element.innerText = element.dataset.originalText; // 원래 글자로 복구  
            element.classList.remove('completed');  
        }  
    }  
</script>  
  
</body>  
</html>
