<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'OngleipBinsuche';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_Binsu-Rg.woff2') format('woff2');
        }
        * { font-family: 'OngleipBinsuche', sans-serif !important; box-sizing: border-box; }
        body { background: transparent; display: flex; flex-direction: column; align-items: center; padding: 20px; }

        /* 말풍선 디자인 유지 */
        .chat-wrap { width: 400px; }
        .my-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .my-msg { background: #ffd1dc; color: #7a5a5a; padding: 10px 18px; border-radius: 18px 18px 2px 18px; font-size: 1.1rem; }
        
        .bot-row { display: flex; margin-top: 5px; }
        .book-img { 
            width: 60px; height: 90px; background: #f0f0f0; 
            border-radius: 8px; margin-right: 12px; object-fit: cover;
            border: 2px solid #fff; box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
        }
        .bot-msg { 
            background: #fff; padding: 15px; border-radius: 2px 18px 18px 18px;
            flex: 1; color: #555; box-shadow: 3px 3px 15px rgba(0,0,0,0.05);
        }
        .book-title { font-weight: bold; font-size: 1.1rem; color: #cc8b8b; margin-bottom: 4px; }
        .book-info { font-size: 0.95rem; line-height: 1.5; color: #888; }
    </style>
</head>
<body>

<div class="chat-wrap">
    <div class="my-row">
        <div class="my-msg">책을찾아줘✨</div>
    </div>

    <div class="bot-row">
        <img id="res-img" class="book-img" src="https://via.placeholder.com/60x90?text=Wait" crossorigin="anonymous">
        <div class="bot-msg">
            <div id="res-title" class="book-title">찾는 중...</div>
            <div id="res-info" class="book-info">잠시만 기다려주세요.</div>
        </div>
    </div>
</div>

<script>
    const KAKAO_KEY = 'a750842441383ebada10f6d8d60017ce'; // 👈 여기에 키를 정확히 넣어줘!

    async function getBook(title) {
        const img = document.getElementById('res-img');
        const tit = document.getElementById('res-title');
        const inf = document.getElementById('res-info');

        try {
            // URL에 직접 쿼리를 담아 호출하는 가장 확실한 방식
            const url = `https://dapi.kakao.com/v2/search/book?query=${encodeURIComponent(title)}&size=1`;
            
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': `KakaoAK ${KAKAO_KEY.trim()}` // 공백 자동 제거
                }
            });

            const result = await response.json();

            if (result.documents && result.documents.length > 0) {
                const book = result.documents[0];
                // 썸네일 주소가 있을 때만 교체
                if(book.thumbnail) {
                    img.src = book.thumbnail.replace('http://', 'https://'); // 보안 주소 강제 전환
                }
                tit.innerText = book.title;
                inf.innerText = `${book.authors[0]} 저 | ${book.contents.substring(0, 50)}...`;
            } else {
                tit.innerText = "책을 찾지 못했어요.";
            }
        } catch (e) {
            console.error(e);
            tit.innerText = "연결 오류가 발생했어요.";
        }
    }

    // 문서가 완전히 준비되면 실행
    document.addEventListener('DOMContentLoaded', () => {
        getBook('아가미');
    });
</script>

</body>
</html>
